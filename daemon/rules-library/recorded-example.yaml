# Generated by fakenet-nucleus --rules-from-har from daemon/rules-library/recorded-example.har: replays the recorded
# responses. Requests are matched by method, host & path; several responses to one
# request are played in order for each sample (then the last one repeats).
# Use it: copy into routes/, then add `- to: direct:decide-recorded` to decide-http
# (requests it doesn't know keep the other rules' answer, or the default).
- route:
    id: decide-recorded
    from:
      uri: direct:decide-recorded
      steps:
        - setBody:
            groovy: |
              def recorded = [
                'GET c2.recorded.example /api/v1/hello': ['SFRUUC8xLjEgMjAwIE9LDQpDb250ZW50LVR5cGU6IGFwcGxpY2F0aW9uL2pzb24NCg0KeyJzdGF0dXMiOiJuZXciLCJzbGVlcCI6MzAsInYiOjJ9', 'SFRUUC8xLjEgMjAwIE9LDQpDb250ZW50LVR5cGU6IGFwcGxpY2F0aW9uL2pzb24NCg0KeyJzdGF0dXMiOiJ0YXNrIiwiY21kIjoic3lzaW5mbyJ9', 'SFRUUC8xLjEgMjAwIE9LDQpDb250ZW50LVR5cGU6IGFwcGxpY2F0aW9uL2pzb24NCg0KeyJzdGF0dXMiOiJ0YXNrIiwiY21kIjoiZG93bmxvYWQiLCJ1cmwiOiJodHRwOi8vY2RuLnJlY29yZGVkLmV4YW1wbGUvbS5iaW4ifQ=='],
                'POST c2.recorded.example /api/v1/result': ['SFRUUC8xLjEgMjA0IE5vIENvbnRlbnQNCg0K'],
              ]
              def host = (request.headers.FakenetHost ?: '').split(':')[0].toLowerCase()
              def path = ((request.headers.FakenetPath ?: '/') as String).split('[?#]')[0] ?: '/'
              def key = "${request.headers.FakenetMethod} ${host} ${path}".toString()
              def responses = recorded[key]
              if (!responses) return request.body
              def state = camelContext.registry.lookupByName('state')
              def n = state.increment(request.headers.FakenetActor ?: 'unknown', 'recorded ' + key)
              request.setHeader('FakenetRoute', 'recorded')
              responses[Math.min(n - 1, responses.size() - 1) as int].decodeBase64()
