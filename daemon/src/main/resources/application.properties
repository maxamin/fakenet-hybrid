# FakeNet hybrid daemon. Every interface binds to 127.0.0.1 (lab use only): the analysis
# network never reaches the daemon. Override any property with -Dname=value or CAMEL_* env vars.

camel.main.name = fakenet-daemon

# Routes: link.yaml (transport, rarely edited) & decisions.yaml (the analyst's rules)
camel.main.routes-include-pattern = file:routes/*.yaml
# Hot reload: edit a route file and only that file's routes restart, so the WebSocket stays up
camel.main.routes-reload-enabled = true
camel.main.routes-reload-directory = routes
camel.main.routes-reload-pattern = *.yaml
camel.main.routes-reload-remove-all-routes = false

# The secondary channel (POST /decide), served by camel-platform-http
camel.server.enabled = true
camel.server.host = 127.0.0.1
camel.server.port = 8091

# Health: GET http://127.0.0.1:8092/observe/health
camel.management.enabled = true
camel.management.host = 127.0.0.1
camel.management.port = 8092
camel.management.health-check-enabled = true

# The shared link secret (same file as the nucleus's [daemon] secret_file; create it with
# `fakenet-nucleus --generate-secret PATH`). Blank: unauthenticated link (not recommended:
# any local process could then impersonate either side)
fakenet.link.secret-file =

# The primary channel (the vertx-websocket consumer in link.yaml)
fakenet.link.host = 127.0.0.1
fakenet.link.port = 8090

# Wire Tap output (one JSON line per event + decision)
fakenet.audit.dir = audit
