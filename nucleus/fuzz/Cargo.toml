[package]
name = "fakenet-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
fakenet-schema = { path = "../crates/schema" }
fakenet-sniffer = { path = "../crates/sniffer" }
fakenet-capture = { path = "../crates/capture" }
fakenet-diverter = { path = "../crates/diverter" }
fakenet-listeners = { path = "../crates/listeners", features = ["fuzzing"] }
fakenet-cli = { path = "../crates/cli" }
fakenet-model = { path = "../crates/model" }
serde_json = "=1.0.154"
toml = "=1.1.8"

# Not part of the main workspace (cargo fuzz builds it with its own flags)
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "handlers"
path = "fuzz_targets/handlers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packets"
path = "fuzz_targets/packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link_messages"
path = "fuzz_targets/link_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_and_import"
path = "fuzz_targets/report_and_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model"
path = "fuzz_targets/model.rs"
test = false
doc = false
bench = false
