[StaticURI]
InstanceName:     HTTPCustom
HttpURIs:         /static.txt
HttpStaticString: Static body (<RAW-DATE>)\r\n
ContentType:      text/plain

[RawHost]
ListenerType:     HTTP
HttpHosts:        raw.c2.example
HttpRawFile:      sample_raw_response.txt

[Dynamic]
ListenerType:     HTTP
HttpHosts:        dynamic.c2.example
HttpURIs:         /gate
HttpDynamic:      CustomProviderExample.py

[TCPProvider]
InstanceName:     RawTCPDynamic
TcpDynamic:       upper.py

[TCPStatic]
InstanceName:     RawTCPStatic
TcpStaticBase64:  T0sK

[UDPProvider]
InstanceName:     RawUDPDynamic
UdpDynamic:       upper.py

[UDPStatic]
InstanceName:     RawUDPStatic
UdpStaticString:  static-reply
