# fakenet-rs configuration: FakeNet-NG's format & defaults, plus the protocols added in the
# Rust port. Relative paths are resolved from this file's directory.
#
# Listener types: ProxyListener (protocol detection), RawListener, HTTPListener, FTPListener,
# SMTPListener, POPListener, IMAPListener, IRCListener, TelnetListener, SSHListener,
# RedisListener, SOCKS5Listener, FingerListener, WhoisListener, EchoListener, DiscardListener,
# DaytimeListener, ChargenListener, TimeListener, QOTDListener, DNSListener, TFTPListener,
# NTPListener, SyslogListener.

[FakeNet]
DivertTraffic:         Yes

[Diverter]
# Used only to generate diversion rules: fakenet-rs --diversion-rules
NetworkMode:           SingleHost
RedirectAllTraffic:    Yes
DefaultTCPListener:    ProxyTCPListener
DefaultUDPListener:    ProxyUDPListener
BlackListPortsTCP:     139
BlackListPortsUDP:     67, 68, 137, 138, 443, 1900, 5355

[ProxyTCPListener]
Enabled:     True
Protocol:    TCP
Listener:    ProxyListener
Port:        38926
Listeners:   HTTPListener, SOCKS5Listener, SSHListener, SMTPListener, POPListener, IMAPListener, FTPListener, IRCListener, TelnetListener, RedisListener, DNSListener, SyslogListener, FingerListener, WhoisListener, EchoListener, DiscardListener, DaytimeListener, ChargenListener, TimeListener, QOTDListener, RawListener
# Seconds to wait for a client's first data before choosing a protocol by port
FirstDataTimeout: 2
# Static_CA: No generates a new CA each run (written to the output directory as
# fakenet-ca.pem). FakeNet-NG's bundled CA expired in November 2025, and its key is public.
Static_CA:   No
CA_Cert:     ../../fakenet/configs/fakenet_ca.crt
CA_Key:      ../../fakenet/configs/fakenet_ca.key
Timeout:     30

[ProxyUDPListener]
Enabled:     True
Protocol:    UDP
Listener:    ProxyListener
Port:        38926
Listeners:   DNSListener, TFTPListener, NTPListener, SyslogListener, EchoListener, DaytimeListener, TimeListener, QOTDListener, ChargenListener, DiscardListener, RawListener

[RawTCPListener]
Enabled:     True
Port:        1337
Protocol:    TCP
Listener:    RawListener
UseSSL:      No
Timeout:     10

[RawUDPListener]
Enabled:     True
Port:        1337
Protocol:    UDP
Listener:    RawListener

[DNS Server]
Enabled:     True
Port:        53
Protocol:    UDP
Listener:    DNSListener
ResponseA:   192.0.2.123
ResponseAAAA: 2001:db8::123
ResponseMX:  mail.evil2.com
ResponseTXT: FAKENET
NXDomains:   0

[DNS Server TCP]
Enabled:     True
Port:        53
Protocol:    TCP
Listener:    DNSListener
ResponseA:   192.0.2.123
ResponseAAAA: 2001:db8::123

[HTTPListener80]
Enabled:     True
Port:        80
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      No
Webroot:     ../../fakenet/defaultFiles/
Timeout:     10
DumpHTTPPosts: Yes
DumpHTTPPostsFilePrefix: http

[HTTPListener443]
Enabled:     True
Port:        443
Protocol:    TCP
Listener:    HTTPListener
UseSSL:      Yes
Webroot:     ../../fakenet/defaultFiles/
Timeout:     10
DumpHTTPPosts: Yes
DumpHTTPPostsFilePrefix: http

[SMTPListener]
Enabled:     True
Port:        25
Protocol:    TCP
Listener:    SMTPListener

[FTPListener21]
Enabled:     True
Port:        21
Protocol:    TCP
Listener:    FTPListener
FTProot:     ../../fakenet/defaultFiles/
PasvPorts:   60000-60010
Banner:      !generic

[IRCServer]
Enabled:     True
Port:        6667
Protocol:    TCP
Listener:    IRCListener
ServerName:  irc.fakenet.local
Timeout:     30

[TFTPListener]
Enabled:     True
Port:        69
Protocol:    UDP
Listener:    TFTPListener
TFTPRoot:    ../../fakenet/defaultFiles/
TFTPFilePrefix: tftp

[POPServer]
Enabled:     True
Port:        110
Protocol:    TCP
Listener:    POPListener

[IMAPServer]
Enabled:     True
Port:        143
Protocol:    TCP
Listener:    IMAPListener

[TelnetServer]
Enabled:     True
Port:        23
Protocol:    TCP
Listener:    TelnetListener
Timeout:     60

[SSHServer]
Enabled:     True
Port:        22
Protocol:    TCP
Listener:    SSHListener

[RedisServer]
Enabled:     True
Port:        6379
Protocol:    TCP
Listener:    RedisListener

[SOCKSProxy]
Enabled:     True
Port:        1080
Protocol:    TCP
Listener:    SOCKS5Listener
Timeout:     30

[NTPServer]
Enabled:     True
Port:        123
Protocol:    UDP
Listener:    NTPListener
# Seconds to shift the time served, e.g. to trigger time-delayed malware behaviour
TimeOffset:  0

[SyslogServer]
Enabled:     True
Port:        514
Protocol:    UDP
Listener:    SyslogListener

[FingerServer]
Enabled:     True
Port:        79
Protocol:    TCP
Listener:    FingerListener

[WhoisServer]
Enabled:     True
Port:        43
Protocol:    TCP
Listener:    WhoisListener

# The classic small services are disabled by default (rarely used, often abused for
# reflection). They're still recognized by the proxy listener on any port.
[EchoServer]
Enabled:     False
Port:        7
Protocol:    TCP
Listener:    EchoListener

[DaytimeServer]
Enabled:     False
Port:        13
Protocol:    TCP
Listener:    DaytimeListener
