# FakeNet hybrid nucleus: sample config (lab use only)
# Relative paths are relative to this file's directory.

[nucleus]
bind = "0.0.0.0"                 # the fake services, on the analysis network side
capture_dir = "capture"          # events.jsonl, traffic.pcap, files/, ca.pem
timeout_ms = 30000               # idle client timeout
first_data_timeout_ms = 500      # auto listeners: wait this long for a client to speak first
health = "127.0.0.1:8099"        # GET /health (loopback only; enforced; details need the secret as a Bearer token)
max_events_mb = 256              # rotate events.jsonl past this size...
max_pcap_mb = 1024               # ...and traffic.pcap / wire.pcap past this one
keep_rotations = 4               # rotated files kept
max_files_mb = 2048              # stop saving payloads to files/ past this total
wire_capture = false             # also record every real packet to wire.pcap (root/Administrator)
tls_keylog = true                # TLS secrets to tls-keys.log: Wireshark decrypts wire.pcap with it
fingerprints = ["fingerprints/sslbl-ja3.csv"]  # known JA3/JA4/HASSH lists (see fingerprints/README.md)
ca_cert = "ca/fakenet-ca.pem"      # the interception CA: loaded if present, else created once and kept,
ca_key = "ca/fakenet-ca.key"       # so the VM trusts it across restarts (remove both lines: a new CA per start)

[limits]                         # so a hostile sample can't exhaust the nucleus (0: unlimited)
max_sessions = 4096              # concurrent TCP connections + UDP clients; new ones past it are dropped
per_source_per_second = 0        # new sessions per second per source address (off: scanners open many)
per_source_burst = 200
memory_budget_mb = 1024          # payloads buffered at once (bodies, uploads, emails); past it they're refused

[manual]                         # live manual mode: answer matching requests yourself in the dashboard
enabled = false                  # off: every request gets a rule's or the default answer at once
timeout_ms = 120000              # an unanswered held request gets the proposed answer after this
# protocols = ["http", "raw"]    # hold only these protocols (empty: all)
# hosts = ["c2.example"]         # ...only these hosts/subdomains or destination IPs
# contains = "/gate"             # ...only requests whose path, name or command contains this

# Reverse-engineering hooks: act on the sample's process when an event matches, before it
# gets its answer. Actions: pause (SIGSTOP; resume from the dashboard), dump (readable memory
# to capture/hooks/, Linux), command (argv, no shell; placeholders {pid} {session_id}
# {request_id} {protocol} {event} {dir}).
# [[hook]]
# name = "first-beacon"
# protocols = ["http"]
# hosts = ["c2.example"]
# actions = ["dump", "pause"]
# once = true
# [[hook]]
# name = "trace-sockets"
# actions = ["command"]
# command = ["frida", "-p", "{pid}", "-l", "/opt/fakenet-hybrid/hooks/net-backtrace.js"]
# wait_ms = 3000                 # hold the answer until Frida has attached

# Responders: answer what the rules and the explorer leave, from a model learned with
# `fakenet-nucleus --learn capture/ datasets/*.pcap -o model.json`, or from a plugin
# (plugins/README.md). Tried in order; the first answer wins.
# [[responder]]
# name = "model"
# kind = "model"
# packs = ["model.json"]
# protocols = ["http", "dns"]
# [[responder]]
# name = "radamsa"
# kind = "plugin"
# command = ["python3", "-I", "/opt/fakenet-hybrid/plugins/radamsa_mutator.py", "--rate", "0.3"]
# protocols = ["raw"]
# timeout_ms = 150

# Online learning: answers given during the run (rules, manual mode, plugins) are added to
# this pack; a model responder listing it in `packs` answers from it as it grows. Add
# `generate = true` to a model responder for new text answers instead of replays.
# [learn]
# into = "live-model.json"
# sources = ["rules", "manual", "plugins"]    # also "explorer"
# save_every_s = 30

[yara]                           # scan every saved payload (bodies, uploads, emails) with YARA
rules = []                       # rule files or folders of *.yar/*.yara, e.g. ["yara-rules"]
# yara = "yara"                  # the stock YARA tools (on PATH by default; yara.exe/yarac.exe on Windows)
# yarac = "yarac"

[daemon]                         # the Camel daemon (loopback only; enforced). "" disables a channel
websocket_url = "ws://127.0.0.1:8090/link"
http_url = "http://127.0.0.1:8091/decide"
deadline_ms = 200                # per decision; on timeout/error the defaults below apply
backoff_initial_ms = 100
backoff_max_ms = 10000
max_payload_kb = 1024            # payload sent to the daemon per event; larger ones are cut (meta.payload_truncated)
# The shared secret authenticating the link both ways (strongly recommended: without it any
# local process could pose as the daemon). Create it with:
#   fakenet-nucleus --generate-secret link.secret
# and give the daemon the same file (-Dfakenet.link.secret-file=...).
# secret_file = "link.secret"

[diverter]
enabled = false                  # true inside the analysis VM (needs root/Administrator)
mode = "single_host"             # or "gateway" (Linux: this host routes the analysis network)
ignore_ports = []                # e.g. [22] to keep managing a gateway over SSH
excluded_processes = []          # e.g. ["python3", "procmon64.exe"]; never diverted
answer_ping = true               # answer ICMP echo to any address
# Windows only:
# gateway_address = ["10.6.6.1"] # mode = "gateway": this host's address on the analysis network
# fix_dns = false                # point DNS at fix_dns_server while running (FakeNet-NG ModifyLocalDNS)
# fix_dns_server = "192.0.2.53"
# fix_gateway = false            # add a default route if there is none (FakeNet-NG FixGateway)
# queue_num = 4242               # Linux NFQUEUE, used only with excluded_processes
# ipv6 = true

# Built-in default responses: used whenever the daemon doesn't decide in time
[defaults]
latency_ms = [0, 0]              # random delay [min, max] before each answer; e.g. [20, 120]: instant answers are a sandbox tell

[defaults.http]
webroot = "default-files"        # served by path; missing files get a default of their type (FakeNet-NG's)
server_header = "Microsoft-IIS/10.0"
max_body_bytes = 16777216
save_bodies = true
connectivity_checks = true       # answer Windows NCSI, Android/Chrome generate_204, Apple & Firefox captive-portal probes as a real network would

[defaults.dns]
a = "192.0.2.123"                # point this at the nucleus's address on the analysis network
# aaaa = "2001:db8::123"
mx = "mail.fakenet.local"
txt = "FAKENET"
ttl = 60
per_domain = false               # true: each name gets its own stable address from `pool` (and a matching PTR)
pool = "198.18.0.0/15"
nxdomain_random = false          # true: NXDOMAIN for random-looking (DGA) names, as the real Internet does

[defaults.raw]
mode = "echo"                    # or "static"
response = ""

[defaults.mail]
hostname = "mail.fakenet.local"

[defaults.ftp]
root = "default-files"           # files served by path (else a default file of the type)
banner = "FTP Server Ready"
passive_ports = [60000, 60010]   # the diverter keeps these ports as-is; [0, 0] = any free port

[defaults.irc]
server_name = "irc.fakenet.local"

[defaults.tftp]
root = "default-files"

[defaults.ssh]
banner = "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.10"

[defaults.telnet]
banner = "Ubuntu 20.04.6 LTS"

[defaults.ntp]
time_offset = 0                  # seconds added to the time served

# Listeners (an http listener on UDP serves HTTP/3). protocol = http | dns | raw | smtp | pop3 | imap | ftp | tftp | irc | ssh |
# telnet | redis | ntp | socks | syslog | echo | discard | daytime | chargen | time | qotd |
# finger | whois | auto. "auto" sniffs each connection (HTTP on 81, FTP on 80, TLS or SOCKS
# on anything...). Optional per listener: tls = true, custom = "FakeNet-NG custom.ini",
# process_whitelist / process_blacklist / host_whitelist / host_blacklist = [...].
# Convert an existing FakeNet-NG default.ini with: fakenet-nucleus --import-fakenet-ini
[[listener]]
name = "DNS"
protocol = "dns"
transport = "udp"
port = 53

[[listener]]
name = "DNS-TCP"
protocol = "dns"
port = 53

[[listener]]
name = "HTTP"
protocol = "http"
port = 80

[[listener]]
name = "HTTPS"
protocol = "http"
port = 443
tls = true

# HTTP/3 (QUIC): protocol "http" on UDP. Without it, clients fall back to TCP 443 anyway
[[listener]]
name = "HTTP3"
protocol = "http"
transport = "udp"
port = 443

[[listener]]
name = "SMTP"
protocol = "smtp"
port = 25

[[listener]]
name = "SMTPS"
protocol = "smtp"
port = 465
tls = true

[[listener]]
name = "POP3"
protocol = "pop3"
port = 110

[[listener]]
name = "FTP"
protocol = "ftp"
port = 21

[[listener]]
name = "IRC"
protocol = "irc"
port = 6667

[[listener]]
name = "TFTP"
protocol = "tftp"
transport = "udp"
port = 69

[[listener]]
name = "IMAP"
protocol = "imap"
port = 143

[[listener]]
name = "Telnet"
protocol = "telnet"
port = 23

[[listener]]
name = "Redis"
protocol = "redis"
port = 6379

[[listener]]
name = "SOCKS"
protocol = "socks"
port = 1080

[[listener]]
name = "NTP"
protocol = "ntp"
transport = "udp"
port = 123

[[listener]]
name = "Syslog"
protocol = "syslog"
transport = "udp"
port = 514

# SSH clients are fingerprinted (HASSH); skip this if the VM runs its own sshd on 22
[[listener]]
name = "SSH"
protocol = "ssh"
port = 22

# Credential capture (NTLM / VNC): logs what a sample offers, then fails the logon
[[listener]]
name = "SMB"
protocol = "smb"
port = 445

[[listener]]
name = "LDAP"
protocol = "ldap"
port = 389

[[listener]]
name = "RDP"
protocol = "rdp"
port = 3389

[[listener]]
name = "VNC"
protocol = "vnc"
port = 5900

# IoT & web C2 (each message reaches the daemon; a rule or the explorer can task the bot)
[[listener]]
name = "MQTT"
protocol = "mqtt"
port = 1883

[[listener]]
name = "CoAP"
protocol = "coap"
transport = "udp"
port = 5683

# DNS over TLS; DNS over HTTPS is served by the HTTPS listeners at /dns-query
[[listener]]
name = "DoT"
protocol = "dns"
port = 853
tls = true

[[listener]]
name = "Auto"                    # the diverter sends every other TCP port here
protocol = "auto"
port = 1337

[[listener]]
name = "RawUDP"                  # ...and every other UDP port here
protocol = "auto"
transport = "udp"
port = 1338

# The response explorer (off by default): when the daemon doesn't decide, answer with
# protocol templates filled from the sample's strings and REA's analysis, and learn which
# answers unlock new behaviour or new functions. Writes capture/explorer-map.json.
# See README "Exploring a sample".
[explorer]
enabled = false
# rate = 0.8                     # share of undecided requests that get an explored answer
# seed = 24301                   # for reproducible runs
# window_ms = 3000               # new behaviour within this long is credited to the answer
# coverage_weight = 5.0          # reward per newly reached function
# samples = ["sample.exe"]       # strings become hints (and the SHA-256 is checked against REA's)
# rea = ["rea.jsonl"]            # scripts/rea-hints.sh output: procedures, strings, imports
# coverage_dir = "coverage"      # a tracer writes drcov *.log or JSONL here
# module = "sample.exe"          # the sample's module name in drcov
# image_base = "0x400000"        # REA's image base, for rebasing drcov offsets
# templates = []                 # extra template files (format: crates/explorer/templates/default.toml)
# protocols = []                 # limit exploration (empty: every protocol with templates)
# corpus_dir = "explorer-corpus" # keep rewarded answers across runs, for the {corpus} slot
